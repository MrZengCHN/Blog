<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CPA Codex认证文件格式转换</title>
  <desc id="desc">A visual cover showing JSON authentication data converted into Codex auth format.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 474 C190 410 310 520 492 446 C674 372 782 262 1200 354 L1200 630 L0 630 Z" fill="#14b8a6" opacity="0.18"/>
  <path d="M0 164 C196 230 346 124 548 192 C748 260 838 310 1200 202 L1200 0 L0 0 Z" fill="#f59e0b" opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="90" y="120" width="400" height="360" rx="24" fill="url(#panel)" stroke="#94a3b8" stroke-opacity="0.28"/>
    <rect x="710" y="120" width="400" height="360" rx="24" fill="url(#panel)" stroke="#67e8f9" stroke-opacity="0.35"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="18">
    <path d="M535 315 H650" stroke="#22c55e"/>
    <path d="M618 276 L660 315 L618 354" stroke="#22c55e" stroke-linejoin="round"/>
  </g>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="132" y="174" fill="#f8fafc" font-size="34" font-weight="700">CPA JSON</text>
    <text x="132" y="230" fill="#93c5fd" font-size="26">{</text>
    <text x="158" y="268" fill="#e2e8f0" font-size="24">"id_token": "...",</text>
    <text x="158" y="306" fill="#e2e8f0" font-size="24">"access_token": "...",</text>
    <text x="158" y="344" fill="#e2e8f0" font-size="24">"refresh_token": "...",</text>
    <text x="158" y="382" fill="#e2e8f0" font-size="24">"account_id": "..."</text>
    <text x="132" y="420" fill="#93c5fd" font-size="26">}</text>

    <text x="752" y="174" fill="#f8fafc" font-size="34" font-weight="700">Codex Auth</text>
    <text x="752" y="230" fill="#67e8f9" font-size="26">{</text>
    <text x="778" y="268" fill="#e2e8f0" font-size="24">"auth_mode": "chatgpt",</text>
    <text x="778" y="306" fill="#e2e8f0" font-size="24">"OPENAI_API_KEY": null,</text>
    <text x="778" y="344" fill="#e2e8f0" font-size="24">"tokens": { ... },</text>
    <text x="778" y="382" fill="#e2e8f0" font-size="24">"last_refresh": "..."</text>
    <text x="752" y="420" fill="#67e8f9" font-size="26">}</text>
  </g>

  <g>
    <rect x="354" y="506" width="492" height="64" rx="32" fill="#f8fafc" opacity="0.95"/>
    <text x="600" y="548" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">
      CPA Codex认证文件格式转换
    </text>
  </g>
</svg>
